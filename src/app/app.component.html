<nav class="nav" [class.nav-scrolled]="scrolled()" aria-label="Main">
  <div class="wrap nav-inner">
    <a href="#about" class="brand" aria-label="Kimmo Savilampi">
      <span class="brand-mark">KS</span>
      <span class="brand-name">Kimmo Savilampi</span>
    </a>

    <ul class="nav-links">
      @for (section of sections; track section) {
        <li>
          <a
            [href]="'#' + section"
            [class.active]="activeSection() === section"
            [attr.aria-current]="activeSection() === section ? 'true' : null"
            >{{ "app.nav." + section | translate }}</a
          >
        </li>
      }
    </ul>

    <div class="nav-controls">
      <div class="segmented" role="group" [attr.aria-label]="'app.language.label' | translate">
        @for (code of languages; track code) {
          <button
            type="button"
            [class.on]="language() === code"
            [attr.aria-pressed]="language() === code"
            [attr.aria-label]="languageNameKeys[code] | translate"
            [attr.lang]="code"
            (click)="setLanguage(code)"
          >
            {{ languageLabels[code] }}
          </button>
        }
      </div>
      <button
        type="button"
        class="icon-btn"
        (click)="toggleTheme()"
        [attr.aria-label]="themeToggleKey() | translate"
        [attr.title]="themeToggleKey() | translate"
      >
        <i class="fa-solid" [class.fa-sun]="isDarkMode()" [class.fa-moon]="!isDarkMode()"></i>
      </button>
    </div>
  </div>
</nav>

<main>
  <app-about-tab id="about"></app-about-tab>
  <app-experience-tab id="experience"></app-experience-tab>
  <app-game-tab id="game"></app-game-tab>
  <app-other-projects-tab id="projects"></app-other-projects-tab>
</main>

<app-footer></app-footer>
